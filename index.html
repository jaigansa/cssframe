<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSSFrame - Modular UI Components & CSS Library</title>
  
  <!-- CSSFrame Framework & App Styles -->
  <link rel="stylesheet" href="css/cssframe.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Top Application Header -->
  <header class="app-header">
    <a href="#" class="app-brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span>CSSFrame</span>
      <span class="brand-badge">v1.0</span>
    </a>

    <!-- Live Search Bar -->
    <div class="search-container">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search components (e.g., button, card, input, avatar)...">
    </div>

    <!-- Header Actions -->
    <div class="header-actions">
      <button id="themeToggleBtn" class="cf-btn cf-btn-outline cf-btn-sm" title="Toggle Light/Dark Theme">
        <svg id="themeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="themeBtnText">Dark</span>
      </button>
      <button id="copyCdnBtn" class="cf-btn cf-btn-primary cf-btn-sm" title="Copy CSSFrame CDN link for external sites">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>Copy CDN Link</span>
      </button>
    </div>
  </header>

  <!-- Main Showcase Container -->
  <div class="app-main">

    <!-- Category Navigation Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-title">Categories</div>
      <nav id="sidebarNav"></nav>
    </aside>

    <!-- Component Content Grid -->
    <main class="app-content">
      <div class="section-header">
        <h1 id="categoryTitle" class="section-title">All Components</h1>
        <p id="categoryDesc" class="section-desc">Browse and copy modern pure HTML/CSS components ready for your project.</p>
      </div>

      <div id="componentsGrid" class="components-grid">
        <!-- Components cards rendered dynamically via JS -->
      </div>
    </main>
  </div>

  <!-- Component View Code Modal -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalTitle" class="modal-title">Component Title</h3>
        <button id="modalCloseBtn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div>
          <label class="cf-label" style="margin-bottom: 0.5rem; display: block;">Live Preview</label>
          <div id="modalPreview" class="preview-container" style="border-radius: 0.5rem; border: 1px solid var(--app-border);">
            <!-- Live Preview -->
          </div>
        </div>

        <div>
          <div class="code-tabs">
            <button id="tabHtmlBtn" class="code-tab-btn active">HTML Code</button>
            <button id="tabCssBtn" class="code-tab-btn">CSS Snippet</button>
          </div>
          <div style="position: relative;">
            <pre id="modalCodeBox" class="code-box"></pre>
            <button id="copyModalCodeBtn" class="copy-badge-btn" style="display: inline-flex; align-items: center; gap: 0.35rem;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              <span>Copy Code</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toastMsg">Code copied to clipboard!</span>
  </div>

  <!-- Scripts -->
  <script src="js/components-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
