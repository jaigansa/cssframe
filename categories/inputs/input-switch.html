<!-- Component: Toggle Switch -->
<div style="display: flex; align-items: center; gap: 0.75rem;">
  <label class="cf-switch">
    <input type="checkbox" checked>
    <span class="cf-slider"></span>
  </label>
  <span style="font-size: 0.875rem; font-weight: 500;">Enable Notifications</span>
</div>

<style>
.cf-switch { position: relative; width: 44px; height: 24px; }
.cf-slider { position: absolute; cursor: pointer; inset: 0; background: var(--cf-border); border-radius: 24px; transition: .3s; }
.cf-slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
input:checked + .cf-slider { background-color: var(--cf-primary); }
input:checked + .cf-slider:before { transform: translateX(20px); }
</style>
